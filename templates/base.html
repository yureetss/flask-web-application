<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <title>{% block title %}{% endblock %}</title>
</head>
  <body>
    <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
      <div class="container d-flex justify-content-between align-items-center">
        <a href="/" class="d-inline-flex link-body-emphasis text-decoration-none">
          <img class="header__image" src="{{ url_for('static', filename='image/law.png') }}">
        </a> 
        <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0 custom-nav">
          <li><a href="{{ url_for('index') }}" class="nav-link px-2 link-secondary">Главная</a></li>
          <li><a href="{{ url_for('records.posts') }}" class="nav-link px-2">Все записи</a></li>
        </ul>
        <div>
          {% if 'user' in session %}
            <a href="{{ url_for('user_account.account') }}" class="btn btn-primary">Личный кабинет</a>
            <a href="{{ url_for('user_account.logout') }}" class="btn btn-outline-primary me-2">Выйти</a>
          {% else %}
            <a href="{{ url_for('authentification.signin') }}" class="btn btn-outline-primary me-2">Войти</a>
            <a href="{{ url_for('registration.signup') }}" class="btn btn-primary">Регистрация</a>
          {% endif %}
        </div>
      </div>
    </header>
    <main class="flex-grow-1">
      {% block body %}{% endblock %}
    </main>
    <footer class="text-center py-3">
      <p class="mb-0 text-body-secondary">© yureetss</p>
    </footer>
  </body>
</html>
